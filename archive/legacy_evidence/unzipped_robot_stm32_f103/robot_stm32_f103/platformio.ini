; PlatformIO Project Configuration File
; Project: 2-Wheel Differential Robot (ESP32-32D DevKitC + MKE-M18 + GA25-370)
; Framework: Arduino (ESP32)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -I include