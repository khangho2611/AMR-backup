# ==============================================================================
# slam_toolbox.yaml - Cấu hình SLAM Toolbox (online_async) tối ưu cho RPLIDAR C1
# ==============================================================================

slam_toolbox:
  ros__parameters:

    # 1. Định danh hệ quy chiếu và topic
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_slam
    use_map_saver: true
    mode: mapping

    # 2. Cấu hình xử lý & Quản lý bộ nhớ trên Raspberry Pi
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05       # 20 Hz
    map_update_interval: 1.0             # Cập nhật bản đồ sau mỗi 2 giây
    resolution: 0.05                     # Độ phân giải ô lưới: 5cm / cell
    max_laser_range: 12.0                # Tầm quét tối đa cho thuật toán SLAM
    minimum_time_interval: 0.1           # Nhận tối đa 10 scan/giây
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000          # Cỡ stack tối đa cho Ceres Solver
    enable_interactive_mode: true

    # 3. Ngưỡng di chuyển để cập nhật Pose Graph (tránh quá tải CPU khi đứng yên)
    minimum_travel_distance: 0.15        # Di chuyển ít nhất 15cm mới thêm node mới
    minimum_travel_heading: 0.174        # Hoặc quay ít nhất ~10 độ (0.174 rad)

    # 4. Kích thước Scan Buffer & So khớp quét (Scan Matching)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # 5. Tham số tối ưu hóa Ceres Solver
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # 6. Khoảng cách tìm kiếm vòng lặp (Loop Closure)
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # 7. Trọng số Scan Matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
